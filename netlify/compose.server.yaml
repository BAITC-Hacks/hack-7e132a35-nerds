name: akim-server
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: akim
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing database password}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Missing application password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/docker-init.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d akim"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://akim_app:${APP_DB_PASSWORD}@db:5432/akim
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN}
      ALLOW_HTTP_LOCALHOST: "false"
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      SESSION_HOURS: "12"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  web:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
