services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: akim
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Use scripts/review.mjs}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Use scripts/review.mjs}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/docker-init.sh:/docker-entrypoint-initdb.d/10-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d akim"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://akim_app:${APP_DB_PASSWORD}@db:5432/akim
      APP_ORIGIN: http://localhost:${APP_PORT:-3000}
      ALLOW_HTTP_LOCALHOST: "true"
      ALLOW_REGISTRATION: "true"
      SESSION_HOURS: "12"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
